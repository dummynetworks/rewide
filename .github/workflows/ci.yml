name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Cloudflare Pages app
        run: npm run build

      - name: Build Pagefind snapshot fixture
        run: |
          npm install --prefix tools/pagefind-indexer
          npm run build --prefix tools/pagefind-indexer -- --input examples/sample-documents.ndjson --output dist/pagefind
          test -s tools/pagefind-indexer/dist/pagefind/pagefind.js
